<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<script>(function(){try{var PIN="halloween",q=new URLSearchParams(location.search).get("theme"),d=new Date(),k=d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate(),t=PIN||q||(k<=20261031?"halloween":""),h=document.documentElement;h.setAttribute("data-ver",{halloween:"V01.2",loykrathong:"V01.3"}[t]||"V01");if(t&&t!=="default")h.setAttribute("data-theme",t)}catch(e){}})()</script>
<title>CARELINK F/U report</title>
<style>
:root{--bg:#eef3f9;--card:#fff;--tx:#0b1f3a;--mu:#5a6b82;--bd:#d3deeb;--fl:#f5f8fc;--ac:#004b87;--hd:#004b87;--acs:#e5eef8;--acx:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1322;--card:#14203a;--tx:#e6edf7;--mu:#97a6bd;--bd:#273857;--fl:#0e1829;--ac:#6fb0ff;--hd:#0a3d70;--acs:#17304f;--acx:#071425}}
:root[data-theme="dark"]{--bg:#0b1322;--card:#14203a;--tx:#e6edf7;--mu:#97a6bd;--bd:#273857;--fl:#0e1829;--ac:#6fb0ff;--hd:#0a3d70;--acs:#17304f;--acx:#071425}


html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 12px)}
*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent}
body{touch-action:manipulation;-webkit-text-size-adjust:100%;margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Sukhumvit Set",Thonburi,"Segoe UI",Sarabun,system-ui,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:16px;display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
@media (min-width:960px){.wrap{grid-template-columns:minmax(0,1fr) 360px;align-items:start;padding:24px}aside{position:sticky;top:16px}#mbar{display:none!important}}
.top{background:var(--hd);color:#fff;border-bottom:3px solid var(--ac)}
.top .in{max-width:1180px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
@media (min-width:960px){.top .in{padding:16px 24px}}
h1{font-size:19px;margin:0;font-weight:700;color:#fff;letter-spacing:.2px}
.top button.q{color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:6px 14px;min-height:0;font-size:14px;background:rgba(255,255,255,.08)}
.sec{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
.sec>h2{font-size:15.5px;font-weight:700;margin:-16px -16px 14px;padding:11px 16px;background:var(--hd);color:#fff;border-radius:13px 13px 0 0;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.sec>h2 small{font-size:12px;font-weight:400;color:rgba(255,255,255,.75)}
.g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.full{grid-column:1/-1}
@media (max-width:560px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g.stack{grid-template-columns:minmax(0,1fr)}}
label{display:block;font-size:12.5px;color:var(--mu);margin-bottom:4px}
input,textarea,select{width:100%;min-height:42px;padding:9px 11px;font:inherit;font-size:16px;color:var(--tx);background:var(--fl);border:1px solid var(--bd);border-radius:9px}
input[type=date]{min-width:0;max-width:100%;display:block;-webkit-appearance:none;appearance:none;text-align:left;line-height:1.2}
input[type=date]::-webkit-date-and-time-value{text-align:left;min-height:1.2em}
input:focus,textarea:focus,select:focus{outline:2px solid var(--ac);outline-offset:-1px;background:var(--card)}
input::placeholder,textarea::placeholder{color:var(--mu);opacity:.6}
.ui{position:relative}.ui input{padding-right:46px}.ui b{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-weight:400;font-size:13px;color:var(--mu);pointer-events:none}
.row{display:flex;gap:8px;align-items:center}.row>*{min-width:0}
.sym{flex:0 0 42px;min-height:42px;padding:0;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;display:inline-flex;align-items:center;gap:6px;margin:0;padding:8px 13px;border:1px solid var(--bd);border-radius:999px;font-size:13.5px;color:var(--tx);background:var(--card);cursor:pointer;user-select:none;-webkit-user-select:none}
.chip input{position:absolute;opacity:0;width:1px;height:1px;min-height:0;pointer-events:none}
.chip::before{content:"+";font-weight:700;color:var(--mu);width:10px;text-align:center}
.chip:has(input:checked){background:var(--ac);border-color:var(--ac);color:var(--acx)}
.chip:has(input:checked)::before{content:"✓";color:var(--acx)}
.chip:has(input:focus-visible){outline:2px solid var(--ac);outline-offset:2px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 auto;min-height:42px;padding:8px 12px;font-size:14px;border-radius:9px}
.seg button.on{background:var(--ac);border-color:var(--ac);color:var(--acx);font-weight:600}
.opt{margin-top:12px;padding:12px;border-radius:10px;background:var(--acs)}
.tw{margin:0 -6px}
table.f{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:3px 4px}
table.f th{font-size:13px;color:var(--ac);font-weight:700;text-align:center;padding:2px}
table.f td{padding:0}
table.f th:first-child,table.f td:first-child{width:25%}
table.f td:first-child{white-space:normal;font-size:12px;line-height:1.2;color:var(--mu);padding-right:2px;overflow-wrap:anywhere}
table.f input{text-align:center;padding:8px 1px;min-height:40px;min-width:0;text-overflow:ellipsis}
.sub td{overflow:visible}
.sub td{padding-top:12px!important;font-weight:700;color:var(--tx)!important;font-size:13px!important}
#quick{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--mu);margin:12px 0 6px;min-height:34px}
#quick button{padding:6px 12px;font-size:13px;border-radius:999px;border-color:var(--ac);color:var(--ac);min-height:0}
button{font:inherit;padding:11px 16px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button.p{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
button.q{white-space:nowrap;background:none;border-color:transparent;color:var(--mu);padding:8px 10px}
.evp{border:1px solid var(--bd);border-radius:12px;padding:12px;margin-top:10px;display:none}
.dzb{border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-top:10px}
.dzb:first-child{margin-top:0}
.dzb:has(> .chip input:checked){border-color:var(--ac);box-shadow:inset 3px 0 0 var(--ac)}
.dzb .chip{font-weight:700;font-size:15px}
.dzw{display:none;margin-top:12px}
.dzw .row>.seg button{flex:0 0 auto;min-width:58px}
.rx{display:grid;grid-template-columns:44px auto minmax(0,1fr);gap:8px;align-items:center;margin-top:8px}
.rxn{font-size:13px;font-weight:700;color:var(--ac);background:var(--acs);border-radius:8px;text-align:center;padding:10px 0}
.rx>.seg{flex-wrap:nowrap;gap:0;border:1px solid var(--bd);border-radius:9px;overflow:hidden}
.rx>.seg button{border:0;border-radius:0;min-width:56px;padding:8px 12px;min-height:40px}
.rx>.seg button+button{border-left:1px solid var(--bd)}
.atp{grid-column:2/-1}
.atp .seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.atp .seg button{min-width:0;min-height:36px;padding:6px 2px;font-size:13px}
.dzq{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.dzq button{border-color:var(--bd);color:var(--ac);font-weight:600;padding:8px 14px;font-size:14px}

.evp h3{margin:0 0 10px;font-size:16px;font-weight:800;color:var(--ac)}
.acts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:8px}
.acts .p{grid-column:1/-1;min-height:46px}
#msg{font-size:13px;color:var(--mu);min-height:18px;margin:0 0 8px}
aside h2{font-size:15px;margin:0 0 10px}
.rep{background:#fff;color:#111;border:1px solid var(--bd);border-radius:12px;padding:18px 12px;overflow-x:auto}
#mbar{position:sticky;bottom:0;transform:translateZ(0);will-change:transform;z-index:5;display:flex;gap:8px;padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 35%)}
#mbar button{flex:1;min-height:46px}
@media (prefers-reduced-motion:no-preference){.evp,.opt{animation:in .15s ease-out}@keyframes in{from{opacity:0;transform:translateY(-3px)}}}
input,textarea,select{font-size:16px!important}

/* ---------- Halloween (auto: through 31 Oct 2026, or ?theme=halloween) ---------- */
:root[data-theme="halloween"]{color-scheme:dark;--bg:#12081d;--card:#1c0f2e;--tx:#f4eaff;--mu:#b7a1d4;--bd:#3b2559;--fl:#140a22;--ac:#ff8a1f;--hd:#3d1668;--acs:#2d1749;--acx:#1a0a00}
[data-theme="halloween"] .sec>h2{color:#ffc98a;border-bottom:2px solid var(--ac)}
[data-theme="halloween"] .sec>h2 small{color:rgba(255,201,138,.7)}
[data-theme="halloween"] h1::before{content:"🎃 "}
[data-theme="halloween"] .top .in{padding-top:max(14px,env(safe-area-inset-top,0px))}
#bats{display:none}
[data-theme="halloween"] #bats{display:block;position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:hidden;z-index:4}
.bat{position:absolute;left:0;will-change:transform;animation:batfly linear infinite}
.bat i{display:block;animation:batbob ease-in-out infinite alternate}
.bat svg{display:block;width:100%;height:auto;fill:#a577e6;opacity:.6;animation:batflap .42s ease-in-out infinite alternate;transform-origin:50% 40%}
.bat.l i{transform:scaleX(-1)}
@keyframes batfly{from{transform:translate3d(-14vw,0,0)}to{transform:translate3d(114vw,0,0)}}
@keyframes batbob{from{transform:translate3d(0,-7px,0) rotate(-4deg)}to{transform:translate3d(0,7px,0) rotate(4deg)}}
@keyframes batflap{from{transform:scaleY(1)}to{transform:scaleY(.5)}}
@media (prefers-reduced-motion:reduce){[data-theme="halloween"] #bats{display:none}}

.ver{display:inline-block;margin-left:8px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.3px;background:rgba(255,255,255,.2);color:#fff;vertical-align:middle;white-space:nowrap}
.top h1{flex:1;min-width:0}.top button.q{flex:0 0 auto}
@media (max-width:420px){.top .in{gap:8px;padding-left:14px;padding-right:14px}h1{font-size:16px}.ver{margin-left:5px;padding:2px 7px;font-size:11px}.top button.q{padding:5px 11px;font-size:13px}}
/* ---------- Loy Krathong (?theme=loykrathong) ---------- */
:root[data-theme="loykrathong"]{color-scheme:dark;--bg:#06142a;--card:#0e2340;--tx:#fff6e5;--mu:#a9bbd4;--bd:#244470;--fl:#0a1b33;--ac:#ffb43a;--hd:#0d3a63;--acs:#153560;--acx:#2a1600}
[data-theme="loykrathong"] .sec>h2{color:#ffe2a8;border-bottom:2px solid var(--ac)}
[data-theme="loykrathong"] .sec>h2 small{color:rgba(255,226,168,.7)}
[data-theme="loykrathong"] h1::before{content:"🪷 "}
[data-theme="loykrathong"] body{background:linear-gradient(180deg,#06142a 0,#081b36 60%,#0a2442 100%) fixed}
#lights{display:none}
.top{position:relative;overflow:hidden}.top .in{position:relative;z-index:1}
[data-theme="loykrathong"] #lights{display:block;position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:hidden;z-index:0}
.lan{position:absolute;top:100%;will-change:transform;animation:lanrise linear infinite}
.lan i{display:block;animation:lansway ease-in-out infinite alternate;position:relative}
.lan i::before{content:"";position:absolute;left:50%;top:50%;width:260%;aspect-ratio:1;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,180,58,.28),rgba(255,180,58,0) 62%)}
.lan svg{display:block;width:100%;height:auto;position:relative}
.kra{position:absolute;left:0;will-change:transform;animation:krafloat linear infinite}
.kra i{display:block;animation:krabob ease-in-out infinite alternate;position:relative}
.kra i::before{content:"";position:absolute;left:50%;top:10%;width:200%;aspect-ratio:1;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,200,90,.3),rgba(255,200,90,0) 60%)}
.kra svg{display:block;width:100%;height:auto;position:relative}
@keyframes lanrise{0%{transform:translate3d(0,0,0);opacity:0}12%{opacity:.9}80%{opacity:.9}100%{transform:translate3d(0,-110px,0);opacity:0}}
@keyframes lansway{from{transform:translate3d(-16px,0,0) rotate(-4deg)}to{transform:translate3d(16px,0,0) rotate(4deg)}}
@keyframes krafloat{from{transform:translate3d(-16vw,0,0)}to{transform:translate3d(116vw,0,0)}}
@keyframes krabob{from{transform:translate3d(0,-3px,0) rotate(-2deg)}to{transform:translate3d(0,3px,0) rotate(2deg)}}
@media (prefers-reduced-motion:reduce){[data-theme="loykrathong"] #lights{display:none}}

/* ---------- Halloween hero header ---------- */
#moon,#pump{display:none}
[data-theme="halloween"] .top{background:linear-gradient(180deg,#3d3156 0,#241638 22%,#1a0d2b 100%);border-bottom:3px solid #ff8a1f}
[data-theme="halloween"] #bats{position:absolute;z-index:0}
[data-theme="halloween"] .bat svg{fill:#9d82cc;opacity:.85}
[data-theme="halloween"] .top .in{min-height:184px;flex-direction:column;align-items:flex-start;justify-content:flex-end;padding-bottom:20px}
[data-theme="halloween"] .top h1{flex:none;font-size:27px;line-height:1.15;color:#ffa650;text-shadow:0 0 16px rgba(255,138,31,.5);letter-spacing:.2px}
[data-theme="halloween"] h1::before{content:none}
[data-theme="halloween"] .ver{display:block;margin:7px 0 0;padding:0;background:none;border-radius:0;font-size:18px;font-weight:600;letter-spacing:0;color:#ffc47c;text-shadow:none}
[data-theme="halloween"] .ver::after{content:" 🎃 Halloween"}
[data-theme="halloween"] .top button.q{position:absolute;right:16px;top:14px;color:#ffd9ad;border-color:rgba(255,196,124,.45);background:rgba(255,255,255,.06)}
[data-theme="halloween"] #moon{display:block;position:absolute;width:26px;height:26px;border-radius:50%;left:60%;top:24%;background:#f3e6b8;box-shadow:0 0 18px 4px rgba(243,230,184,.4)}
[data-theme="halloween"] #pump{display:block;position:absolute;right:18px;bottom:18px;width:46px}
[data-theme="halloween"] #pump::before{content:"";position:absolute;left:50%;top:55%;width:190%;aspect-ratio:1;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,138,31,.38),rgba(255,138,31,0) 62%)}
[data-theme="halloween"] #pump svg{display:block;position:relative;width:100%;height:auto}
@media (max-width:420px){[data-theme="halloween"] .top h1{font-size:25px}[data-theme="halloween"] .ver{font-size:17px}[data-theme="halloween"] #moon{left:58%}}
@media (max-width:380px){[data-theme="halloween"] .top h1{font-size:22px}[data-theme="halloween"] .ver{font-size:16px}[data-theme="halloween"] #pump{width:40px;right:14px}}
</style>
</head>
<body>
<header class="top"><div id="lights" aria-hidden="true"></div><div id="bats" aria-hidden="true"></div><div class="in"><div id="moon" aria-hidden="true"></div><div id="pump" aria-hidden="true"><svg viewBox="0 0 66 64"><path d="M33 15c0-6 3-10 8-11" stroke="#4f7d2f" stroke-width="4.5" fill="none" stroke-linecap="round"/><ellipse cx="16" cy="39" rx="15" ry="21" fill="#d96a28"/><ellipse cx="50" cy="39" rx="15" ry="21" fill="#d96a28"/><ellipse cx="33" cy="39" rx="19" ry="23" fill="#f28a3b"/><path d="M19 33l7-8 7 8zM33 33l7-8 7 8z" fill="#2b1206"/><path d="M18 43Q33 58 48 43L43 43 40 47 36 43 30 43 26 47 23 43Z" fill="#2b1206"/></svg></div><h1>CARELINK F/U report<span class="ver" id="ver"></span></h1><button class="q" id="clr">ล้างค่า</button></div></header>
<div class="wrap">
<main>

<section class="sec"><h2>Present rhythm</h2><input data-k="rhythm" placeholder="เช่น AP-VP, SR"></section>

<section class="sec"><h2>ผู้ป่วย</h2><div class="g" id="pt"></div></section>

<section class="sec"><h2>อุปกรณ์</h2><div class="g" id="dev"></div></section>

<section class="sec"><h2>Battery</h2>
  <div class="g stack">
    <div><label>Battery</label><div class="ui"><input data-k="batt" inputmode="decimal"><b>V</b></div></div>
    <div><label>Est. longevity</label><div class="row">
      <input id="estInp" data-k="est" inputmode="decimal" style="flex:1">
      <select data-k="estunit" style="flex:0 0 92px"><option>Years</option><option>Months</option></select>
      <button type="button" id="ltBtn" class="sym" title="ใส่ &lt; หน้าตัวเลข">&lt;</button>
    </div></div>
  </div>
  <div class="chips" style="margin-top:12px">
    <label class="chip"><input type="checkbox" data-k="minchk">Min</label>
    <label class="chip"><input type="checkbox" data-k="lowchk">Low battery</label>
  </div>
  <div id="minWrap" class="opt" style="display:none">
    <label id="minLbl">Minimum</label>
    <div class="row">
      <input id="minInp" data-k="minval" inputmode="decimal" style="flex:1">
      <select data-k="minunit" style="flex:0 0 92px"><option>Years</option><option>Months</option></select>
      <button type="button" id="minLtBtn" class="sym" title="ใส่ &lt; หน้าตัวเลข">&lt;</button>
    </div>
  </div>
  <div class="g stack opt" id="lowWrap" style="display:none">
    <div><label>Battery impedance</label><div class="row">
      <div class="ui" style="flex:1"><input id="lowohmInp" data-k="lowohm" inputmode="decimal"><b>Ω</b></div>
      <button type="button" id="gtBtn" class="sym" title="ใส่ &gt; หน้าตัวเลข">&gt;</button>
    </div></div>
    <div><label>RRT</label><div class="ui"><input data-k="rrt" inputmode="decimal"><b>V</b></div></div>
  </div>
</section>

<section class="sec"><h2>ค่าที่วัดได้ / Setting</h2>
  <div class="chips">
    <label class="chip"><input type="checkbox" data-k="bbap_A">A: BBaP</label>
    <label class="chip"><input type="checkbox" data-k="lbbap_RV">RV: LBBaP</label>
    <label class="chip"><input type="checkbox" data-k="lbbap_LV">LV: LBBaP</label>
    <label class="chip"><input type="checkbox" data-k="thr2chk">Threshold ค่าที่ 2</label>
  </div>
  <div id="quick"></div><div class="tw"><table class="f" id="tbl"></table></div>
</section>

<section class="sec"><h2>LV Vector</h2>
  <div class="chips"><label class="chip"><input type="checkbox" data-k="lvvecchk">ใส่ LV Vector / V-V Timing</label></div>
  <div class="g stack opt" id="lvvecWrap" style="display:none">
    <div><label>LV Threshold Vector</label><select data-k="lvvecopt">
      <option value="">— เลือก —</option>
      <option>LV to LV</option>
      <option>LV to RVcoil</option>
      <option>RVcoil to LV</option>
      <option>LVtip to LVring</option>
    </select>
    <div class="row" style="margin-top:8px">
      <input id="lvn1" data-k="lvvecn1" placeholder="เลข 1" inputmode="numeric" style="flex:1">
      <input id="lvn2" data-k="lvvecn2" placeholder="เลข 2" inputmode="numeric" style="flex:1">
    </div></div>
    <div><label>V-V Timing</label><div class="row">
      <select data-k="vvdir" style="flex:1"><option>LV→RV</option><option>RV→LV</option></select>
      <div class="ui" style="flex:0 0 96px"><input data-k="vvms" inputmode="decimal"><b>ms</b></div>
    </div></div>
  </div>
</section>

<section class="sec"><h2>Detection zone <small>แตะ zone ที่เปิดใช้</small></h2><div id="dzs"></div>
  <div style="margin-top:14px"><label>Discrimination</label><input data-k="disc" placeholder="พิมพ์ข้อความ"></div></section>

<section class="sec"><h2>Episodes/Note</h2>
  <label>Note</label>
  <div class="chips" style="margin-bottom:10px"><label class="chip"><input type="checkbox" data-k="noep">No episode</label><label class="chip"><input type="checkbox" data-k="goodp">Good parameters</label></div>
  <textarea data-k="notes" rows="3" placeholder="พิมพ์ข้อความ (ถ้ามี)"></textarea>
  <div style="margin-top:14px"><label>Next follow up</label><input type="date" data-k="nextfu"></div></section>

<section class="sec"><h2>Events (Quick guide) <small>แตะชนิดที่พบ แล้วกรอกเฉพาะที่มีข้อมูล</small></h2>
  <div class="chips" id="evchips"></div>
  <div id="evs"></div>
</section>

<div id="mbar"><button class="p" id="mpdf">Export PDF</button><button id="mprev">ดูใบรายงาน</button></div>
</main>

<aside>
  <div class="acts">
    <button class="p" id="pdf">Export PDF</button>
    <button id="img">รูป (.png)</button>
    <button id="cp">Copy ข้อความ</button>

    <button id="exp">.html</button>

</aside>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const V={};
const pt=[['name','ชื่อ-นามสกุล','full'],['hn','HN'],['fu','Follow-up date','date']];
const dev=[['model','Model'],['doi','DOI (วันที่ใส่)','date'],['mode','Mode'],['rate','Rate','','ppm','numeric']];
const EV=['VF','FVT','VT','NS-VT','SVT','AT','AF'];
const evk=e=>e.replace('-','');
const PCT=['AT','AF'];
const DZ=[['VF','VF'],['FVT','FVT'],['VT','VT'],['VTM','VT Monitor']];
const RXN=6,RXT=['J','ATP'],ATP=['Burst','Ramp','Burst+','Ramp+'];
const setK=(k,v)=>{V[k]=v;const el=document.querySelector(`[data-k="${k}"]`);if(el)el.value=v};
const seg=(k,opts)=>`<div class="seg">${opts.map(o=>`<button type="button" data-set="${k}" data-val="${o}">${o}</button>`).join('')}</div>`;
const rxTxt=(z,i)=>{const t=V[`dzt_${z}_${i}`]||'',a=V[`dza_${z}_${i}`]||'',v=V[`dzv_${z}_${i}`]||'';if(!t&&!v)return'';
  if(t==='J')return v?v+'J':'J';if(t==='ATP'){const n=a||'ATP';return v?`${n}(${v})`:n}return v};
const dzOn=()=>DZ.filter(([z])=>V['dz_'+z]);
function dzRows(z){if(z==='VTM')return[];const o=[];for(let i=1;i<=RXN;i++){const t=rxTxt(z,i);if(t)o.push(t)}return o}
const C=['A','RV','LV'];
const RL={pace:'Pacing(%)',sense:'Sensing(mV)',imp:'Impedance(Ω)',defib:'ICD Defib/SVC',thr:'Threshold(V)',thrms:'at(ms)',thr2:'Threshold 2(V)',thrms2:'at 2(ms)',amp:'Amplitude(V)',pw:'Pulse width(ms)',sens:'Sensitivity(mV)'};
const meas=[['pace','Pacing (%)'],['sense','Sensing (mV)'],['imp','Impedance (Ω)'],['defib','ICD Defib/SVC (Ω)'],['thr','Threshold (V)'],['thrms','at (ms)']];
const meas2=[['thr2','Threshold 2 (V)'],['thrms2','at 2 (ms)']];
const set=[['amp','Amplitude (V)'],['pw','Pulse width (ms)'],['sens','Sensitivity (mV)']];
const measDesc=meas.map(([k,l])=>({k,l:RL[k]||l,get:c=>{
  let v=V[k+'_'+c]||'';
  if(V.thr2chk){const k2=k==='thr'?'thr2':k==='thrms'?'thrms2':null;if(k2){const v2=V[k2+'_'+c]||'';if(v2)v=v?v+'/'+v2:v2}}
  return v;
}}));
const setDesc=set.map(([k,l])=>({k,l:RL[k]||l,get:c=>V[k+'_'+c]||''}));
const descRows=desc=>desc.map(d=>`<tr><td class="l">${d.l}</td>${C.map(c=>{const v=d.get(c);return `<td>${v?esc(v):''}</td>`}).join('')}</tr>`).join('');
const VEC_TPL={'LV to LV':'LV{1} to LV{2}','LV to RVcoil':'LV{1} to RVcoil'};
const VEC_BLANKS={'LV to LV':2,'LV to RVcoil':1};
function lvVecText(){const opt=V.lvvecopt||'';if(!opt)return'';const tpl=VEC_TPL[opt];if(!tpl)return opt;return tpl.replace('{1}',gv('lvvecn1')||'_').replace('{2}',gv('lvvecn2')||'_')}
function unitWord(u,val){const n=parseFloat(String(val||'').replace(/[<>]/g,''));const isMonth=u==='Months';if(isMonth)return n===1?'month':'months';return n===1?'year':'years'}
const lvLine=t=>`<tr><td colspan="4" style="border:0;text-align:right;font-weight:400;font-size:10px;height:auto;padding:0 3px 1px 0;white-space:nowrap">${t}</td></tr>`;
function lvVecRows(){
  if(!V.lvvecchk)return'';
  const vt=lvVecText();
  const timing=(V.vvdir||V.vvms)?(esc(V.vvdir||'LV→RV')+' '+gv('vvms')+' ms'):'';
  return (vt?lvLine(vt):'')+(timing?lvLine(timing):'');
}
const fld=([k,l,t,u,im])=>`<div${t==='full'?' class="full"':''}><label>${l}</label>${u?`<div class="ui"><input data-k="${k}"${im?` inputmode="${im}"`:''}><b>${u}</b></div>`:`<input data-k="${k}" type="${t&&t!=='full'?t:'text'}"${im?` inputmode="${im}"`:''}>`}</div>`;
$('#pt').innerHTML=pt.map(fld).join('');
const DT=['Pacemaker','ICD','CRT','CRT-D'];
$('#dev').innerHTML=`<div class="full"><label>ชนิดอุปกรณ์</label><div class="seg" id="dseg">${DT.map(d=>`<button type="button" data-d="${d}">${d}</button>`).join('')}<button type="button" data-d="other">อื่นๆ</button></div><select data-k="dtype" hidden><option value=""></option>${DT.map(d=>`<option>${d}</option>`).join('')}<option value="other">other</option></select><input id="dother" data-k="dother" placeholder="ระบุชนิดอุปกรณ์" style="display:none;margin-top:8px"></div>`+dev.map(fld).join('')+`<div class="full"><label>Charge time</label><div class="row"><div class="ui" style="flex:1"><input data-k="chgs" inputmode="decimal"><b>Sec</b></div><span style="color:var(--mu)">@</span><div class="ui" style="flex:1"><input data-k="chgj" inputmode="decimal"><b>J</b></div></div></div>`;
$('#dseg').onclick=e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset.d;V.dtype=V.dtype===d?'':d;$('[data-k="dtype"]').value=V.dtype;render();if(V.dtype==='other')$('#dother').focus()};
$('#evchips').innerHTML=EV.map(e=>`<label class="chip"><input type="checkbox" data-k="ev_${evk(e)}">${e}</label>`).join('');
$('#evs').innerHTML=EV.map(e=>{const k=evk(e);return `<div class="evp" id="evw_${k}"><h3>${e}</h3><div class="g">
${PCT.includes(e)?`<div><label>% of ${e}</label><div class="ui"><input data-k="evp_${k}" inputmode="decimal"><b>%</b></div></div>`:''}
<div><label>จำนวน (of ${e} episodes)</label><input data-k="evn_${k}" inputmode="numeric"></div>
<div style="grid-column:1/-1"><label>Longest</label><div class="row"><input data-k="evl_${k}" inputmode="decimal" style="flex:1"><select data-k="evu_${k}" style="flex:0 0 96px"><option>min</option><option>sec</option><option>Hrs</option></select></div></div>
<div><label>Last on</label><input type="date" data-k="evd_${k}"></div>
<div><label>V rate during episode(s)</label><div class="ui"><input data-k="evr_${k}" inputmode="numeric"><b>bpm</b></div></div>
</div></div>`}).join('');
$('#dzs').innerHTML=DZ.map(([z,n])=>`<div class="dzb"><label class="chip"><input type="checkbox" data-k="dz_${z}">${n}</label><div class="dzw" id="dzw_${z}">
<div class="row">${seg('dzo_'+z,['On','Off'])}<div class="ui" style="flex:1"><input data-k="dzr_${z}" placeholder="เช่น 200-250"><b>bpm</b></div></div>
${z==='VTM'?'':Array.from({length:RXN},(_,j)=>{const i=j+1;return `<div class="rx"><span class="rxn">RX${i}</span>${seg(`dzt_${z}_${i}`,RXT)}<div class="ui"><input data-k="dzv_${z}_${i}" inputmode="decimal"><b id="rxu_${z}_${i}"></b></div>
<div class="atp" id="atp_${z}_${i}">${seg(`dza_${z}_${i}`,ATP)}</div></div>`}).join('')+
`<div class="dzq"><button type="button" data-q40="${z}">40J × 6</button><button type="button" data-qfill="${z}">Fill RX2-6 same as RX1</button></div>`}
</div></div>`).join('');
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.set){const k=b.dataset.set;V[k]=V[k]===b.dataset.val?'':b.dataset.val;render();return}
  if(b.dataset.q40){const z=b.dataset.q40;for(let i=1;i<=RXN;i++){V[`dzt_${z}_${i}`]='J';V[`dza_${z}_${i}`]='';setK(`dzv_${z}_${i}`,'40')}render();return}
  if(b.dataset.qfill){const z=b.dataset.qfill;for(let i=2;i<=RXN;i++){V[`dzt_${z}_${i}`]=V[`dzt_${z}_1`]||'';V[`dza_${z}_${i}`]=V[`dza_${z}_1`]||'';setK(`dzv_${z}_${i}`,V[`dzv_${z}_1`]||'')}render();return}
});
const row=(([k,l],cls)=>`<tr${cls?` class="${cls}"`:''}><td>${l}</td>${C.map(c=>`<td><input data-k="${k}_${c}" inputmode="decimal"></td>`).join('')}</tr>`);
const mainRows=meas.map(m=>row(m)+(m[0]==='thrms'?meas2.map(m2=>row(m2,'x2')).join(''):'')).join('');
$('#tbl').innerHTML=`<tr><th></th>${C.map(c=>`<th>${c}</th>`).join('')}</tr>`+mainRows+`<tr class="sub"><td colspan="4">Setting</td></tr>`+set.map(m=>row(m)).join('');
const fd=v=>{if(!v)return'';const d=new Date(v);return isNaN(d)?v:d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})};
const dl=(items)=>items.filter(([k])=>V[k]).map(([k,l,t])=>`<dt>${l}</dt><dd>${esc(t?fd(V[k]):V[k])}</dd>`).join('');
function tbl(list){
  const cs=C.filter(c=>list.some(([k])=>V[k+'_'+c]));
  if(!cs.length)return'';
  return `<table><tr><th></th>${cs.map(c=>`<th>${c}</th>`).join('')}</tr>`+
   list.filter(([k])=>cs.some(c=>V[k+'_'+c])).map(([k,l])=>`<tr><td>${l}</td>${cs.map(c=>`<td>${esc(V[k+'_'+c])||'-'}</td>`).join('')}</tr>`).join('')+`</table>`;
}
const DOC_CSS='.doc{font:12px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Sukhumvit Set",Thonburi,Sarabun,"Noto Sans Thai",system-ui,sans-serif;color:#1e3a8a;background:#fff;width:300px;max-width:100%;margin:0 auto}.doc .pt{font-size:11px;color:#111;display:flex;flex-direction:column;gap:1px;margin:0 0 5px 4px}.doc .rt{font-weight:700;font-size:13px;color:#111;text-align:center;margin:0 0 6px}.doc .rh{font-weight:700;color:#111;margin:0 0 3px 4px;min-height:15px}.doc .st{border:2px solid #1e3a8a;padding:5px 6px}.doc .hd{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;gap:8px}.doc .lg{font-weight:800;font-size:16px;letter-spacing:-.3px}.doc .ttl{font-weight:600;border-bottom:1px solid #1e3a8a;margin:3px 0 4px;padding-bottom:1px}.doc .ln{display:flex;gap:8px;margin:3px 0}.doc .ln>span{flex:1;display:flex;gap:4px;align-items:baseline;white-space:nowrap}.doc .u{flex:1;min-width:0;border-bottom:1px solid #1e3a8a;color:#111;font-weight:600;font-style:normal;text-align:center;min-height:15px}.doc table{width:100%;border-collapse:separate;border-spacing:3px 2px;margin:3px 0 0}.doc th{font-weight:400;text-align:center}.doc td{border-bottom:1px solid #1e3a8a;text-align:center;color:#111;font-weight:600;height:17px;padding:0}.doc th.l,.doc td.l{text-align:left;border:0;font-weight:400;color:#1e3a8a;white-space:nowrap;width:1%}.doc td.sh{text-align:left;border:0;font-weight:600;padding-top:4px}.doc .u.uf{flex:0 0 auto;min-width:18px;padding:0 3px}.doc .evo{margin:6px 4px 0}.doc .evi{margin:0 0 3px;line-height:1.6}.doc .evi .u.uf{display:inline-block;min-width:16px;line-height:1.2}.doc table.dzt{margin-top:8px;border-spacing:0;table-layout:fixed}.doc .dzt th{text-align:left;font-weight:700;color:#111;font-size:9.5px;padding:0 4px 2px 0;white-space:nowrap}.doc .dzt .bu{font-weight:400;font-size:7px}.doc .dzt td{border:0;height:auto;text-align:left;vertical-align:middle;font-weight:400;font-size:10.5px;padding:1px 4px 1px 0;white-space:nowrap;overflow:hidden}.doc .dzt td.zn{font-weight:700;font-size:11.5px}.doc .dc{display:flex;gap:4px;align-items:baseline;margin:6px 0 0}.doc .dc .u{font-weight:600}.doc .nt b{font-weight:700}.doc .evn{font-weight:800;color:#111;font-size:13px}.doc .evt{font-weight:700;color:#111;margin-bottom:2px}.doc .k{color:#111;font-weight:600}.doc .nt{color:#111;font-weight:600;margin:5px 0 0 4px;white-space:pre-wrap}';
{const st=document.createElement('style');st.textContent=DOC_CSS;document.head.appendChild(st)}
const repTitle=()=>V.dtype==='Pacemaker'||V.dtype==='CRT'?'ใบรายงานผลการเช็คเครื่องกระตุ้นหัวใจ':V.dtype==='ICD'||V.dtype==='CRT-D'?'ใบรายงานผลการเช็คเครื่องกระตุกหัวใจ':'';
const devType=()=>V.dtype==='other'?(V.dother||'อื่นๆ'):(V.dtype||'');
const gv=k=>V[k]?esc(V[k]):'';
const gdv=k=>V[k]?esc(fd(V[k])):'';
const U=v=>`<i class="u">${v}</i>`;
const mrows=list=>list.map(([k,l])=>`<tr><td class="l">${RL[k]||l}</td>${C.map(c=>`<td>${gv(k+'_'+c)}</td>`).join('')}</tr>`).join('');
const colHead=c=>c+(c==='A'&&V.bbap_A?' (BBaP)':'')+(c==='RV'&&V.lbbap_RV?' (LBBaP)':'')+(c==='LV'&&V.lbbap_LV?' (LBBaP)':'');
const evOn=()=>EV.filter(e=>V['ev_'+evk(e)]);
const epw=v=>parseFloat(String(v||'').replace(/[^0-9.]/g,''))>1?'episodes':'episode';
const UF=v=>`<i class="u uf">${v}</i>`;
function evSegs(e,w){const k=evk(e),g=x=>V[x+k]||'',ep=epw(V['evn_'+k]),o=[];
  if(PCT.includes(e)&&g('evp_'))o.push(`${w(g('evp_'))}% of ${e}`);
  if(g('evn_'))o.push(`${w(g('evn_'))} of ${e} ${ep}`);
  if(g('evl_')){let u=g('evu_')||'min';if(u==='Hrs'&&parseFloat(g('evl_'))===1)u='Hr';o.push(`Longest ${w(g('evl_'))} ${u}`)}
  if(g('evd_'))o.push(`Last on ${w(fd(g('evd_')))}`);
  if(g('evr_'))o.push(`V rate during ${ep} ${w(g('evr_'))} bpm`);
  return o}
function dzRep(){const on=dzOn();if(!on.length)return'';
  return `<table class="dzt"><colgroup><col style="width:28px"><col style="width:26px"><col style="width:50px"><col></colgroup><tr><th colspan="2">Detection</th><th>Rates<span class="bu"> bpm</span></th><th>Therapies</th></tr>${on.map(([z])=>{const t=dzRows(z);let txt=t.join(', ');
  const fit=x=>Math.floor(1780/Math.max(1,x.length)/6.0*10)/10;
  if(fit(txt)<9)txt=t.join(',');
  const fs=Math.max(5.5,Math.min(10.5,fit(txt)));
  return `<tr><td class="zn">${z}</td><td>${gv('dzo_'+z)||'-'}</td><td>${V['dzr_'+z]?gv('dzr_'+z):'-'}</td><td class="th" style="font-size:${fs}px">${txt?esc(txt):'-'}</td></tr>`}).join('')}</table>`}
function evRep(){const on=evOn();if(!on.length)return'';let h='<div class="evo"><div class="evt">Event</div>';
  on.forEach(e=>{h+=`<div class="evi"><b class="evn">${e}:</b> ${evSegs(e,v=>UF(esc(v))).join(', ')}</div>`});return h+'</div>'}
const noteTxt=()=>[V.noep?'No episode':'',V.goodp?'Good parameters':'',V.notes||''].filter(Boolean).join('\n');
const discRep=()=>V.disc?`<div class="dc"><span>Discrimination</span><i class="u" style="white-space:normal;text-align:left">${gv('disc')}</i></div>`:'';
function body(){
  return `<div class="doc">${repTitle()?`<div class="rt">${repTitle()}</div>`:''}${V.name||V.hn?`<div class="pt">${V.name?`<span>ชื่อ ${gv('name')}</span>`:''}${V.hn?`<span>HN ${gv('hn')}</span>`:''}</div>`:''}<div class="rh">${V.rhythm?'Present rhythm: '+gv('rhythm'):''}</div>
<div class="st"><div class="hd"><span class="lg">Medtronic</span><span style="display:flex;gap:4px;flex:1;max-width:60%">Follow up date ${U(gdv('fu'))}</span></div>
<div class="ttl">${esc(devType()||'Pacemaker / ICD / CRT / CRT-D')} F/U</div>
<div class="ln"><span>Model ${U(gv('model'))}</span><span>DOI ${U(gdv('doi'))}</span></div>
<div class="ln"><span>Mode ${U(gv('mode'))}</span><span>Rate ${U(gv('rate'))} ppm</span></div>
<div class="ln"><span>Battery ${U(gv('batt'))} V${V.lowchk&&V.lowohm?`, <b class="k">${gv('lowohm')}</b> ohms`:''}</span><span>Est. ${U(gv('est'))} ${unitWord(V.estunit,V.est)}</span></div>
${(V.lowchk&&V.rrt)||(V.minchk&&V.minval)?`<div class="ln"><span>${V.lowchk&&V.rrt?`RRT ${U(gv('rrt'))} V`:''}</span><span>${V.minchk&&V.minval?`Min ${U(gv('minval'))} ${unitWord(V.minunit,V.minval)}`:''}</span></div>`:''}
<div class="ln"><span style="flex:0 0 auto">Charge time <i class="u uf">${gv('chgs')}</i> Sec @ <i class="u uf">${gv('chgj')}</i> J</span></div>
<table><tr><th class="l">Chamber</th>${C.map(c=>`<th>${colHead(c)}</th>`).join('')}</tr>${descRows(measDesc)}${lvVecRows()}<tr><td class="sh" colspan="4">Setting</td></tr>${descRows(setDesc)}</table>${dzRep()}${discRep()}</div>${evRep()}
${noteTxt()?`<div class="nt"><b>Note:</b> ${esc(noteTxt())}</div>`:''}${V.nextfu?`<div class="nt"><b>Next follow up:</b> ${gdv('nextfu')}</div>`:''}</div>`;
}
let _pt=0,_last='';
const preview=()=>{_pt=0;const h=body();if(h!==_last){_last=h;$('#rep').innerHTML=h}};
const render=()=>{
  if(!_pt)_pt=setTimeout(preview,180);
  $('#dother').style.display=V.dtype==='other'?'':'none';
  $('#minWrap').style.display=V.minchk?'':'none';

  $('#lowWrap').style.display=V.lowchk?'':'none';
  EV.forEach(e=>{$('#evw_'+evk(e)).style.display=V['ev_'+evk(e)]?'block':'none'});
  DZ.forEach(([z])=>{$('#dzw_'+z).style.display=V['dz_'+z]?'block':'none'});
  DZ.forEach(([z])=>{if(z==='VTM')return;for(let i=1;i<=RXN;i++){const t=V[`dzt_${z}_${i}`]||'';$(`#rxu_${z}_${i}`).textContent=t==='J'?'J':'';$(`#atp_${z}_${i}`).style.display=t==='ATP'?'':'none';$(`[data-k="dzv_${z}_${i}"]`).placeholder=t==='ATP'?'จำนวน':''}});
  document.querySelectorAll('[data-set]').forEach(b=>b.classList.toggle('on',V[b.dataset.set]===b.dataset.val));
  document.querySelectorAll('#dseg button').forEach(b=>b.classList.toggle('on',b.dataset.d===V.dtype));
  $('#lvvecWrap').style.display=V.lvvecchk?'':'none';
  document.querySelectorAll('#tbl tr.x2').forEach(tr=>tr.style.display=V.thr2chk?'':'none');
  const _u=VEC_BLANKS[V.lvvecopt]||0;
  $('#lvn1').style.display=_u>=1?'':'none';
  $('#lvn2').style.display=_u>=2?'':'none';
};
function text(){
  const L=[repTitle()||'DEVICE FOLLOW-UP REPORT'];
  const p=(l,k,d)=>V[k]&&L.push(l+': '+(d?fd(V[k]):V[k]));
  p('Present rhythm','rhythm');p('Name','name');p('HN','hn');
  p('Follow-up date','fu',1);L.push('');
  if(V.dtype)L.push('Type: '+devType());p('Model','model');p('DOI','doi',1);p('Mode','mode');p('Rate (ppm)','rate');p('Battery (V)','batt');
  if(V.est)L.push('Est. longevity: '+V.est+' '+unitWord(V.estunit,V.est));
  if(V.minchk&&V.minval)L.push('Minimum: '+V.minval+' '+unitWord(V.minunit,V.minval));
  if(V.lowchk){if(V.lowohm)L.push('Battery impedance (ohms): '+V.lowohm);if(V.rrt)L.push('RRT (V): '+V.rrt);}
  if(V.chgs||V.chgj)L.push('Charge time: '+(V.chgs||'_')+' Sec @ '+(V.chgj||'_')+' J');
  if(V.bbap_A)L.push('A: BBaP');if(V.lbbap_RV)L.push('RV: LBBaP');if(V.lbbap_LV)L.push('LV: LBBaP');L.push('');
  const t=(title,list)=>{const cs=C.filter(c=>list.some(([k])=>V[k+'_'+c]));if(!cs.length)return;L.push(title+' ['+cs.join(' / ')+']');
    list.forEach(([k,l])=>{if(cs.some(c=>V[k+'_'+c]))L.push('  '+l+': '+cs.map(c=>V[k+'_'+c]||'-').join(' / '))});L.push('')};
  const td=(title,desc)=>{const cs=C.filter(c=>desc.some(d=>d.get(c)));if(!cs.length)return;L.push(title+' ['+cs.join(' / ')+']');
    desc.forEach(d=>{if(cs.some(c=>d.get(c)))L.push('  '+d.l+': '+cs.map(c=>d.get(c)||'-').join(' / '))});L.push('')};
  td('Measurements',measDesc);
  if(V.lvvecchk){const vt=lvVecText();if(vt)L.push('LV Vector: '+vt);if(V.vvdir||V.vvms)L.push('V-V Timing: '+(V.vvdir||'LV→RV')+' '+(V.vvms||'')+' ms');L.push('')}
  td('Setting',setDesc);
  if(V.disc)L.push('Discrimination: '+V.disc);
  {const on=dzOn();if(on.length){L.push('Detection zone:');on.forEach(([z])=>{const t=dzRows(z),seg=[V['dzo_'+z]||'',V['dzr_'+z]?V['dzr_'+z]+' bpm':''].filter(Boolean);if(t.length)seg.push('Therapies: '+t.join(', '));L.push('  '+z+(seg.length?': '+seg.join(', '):''))});L.push('')}}
  {const on=evOn();if(on.length){L.push('Event:');on.forEach(e=>L.push('  '+e+': '+evSegs(e,v=>v).join(', ')));L.push('')}}
  if(noteTxt())L.push('Note: '+noteTxt());
  if(V.nextfu)L.push('Next follow up: '+fd(V.nextfu));
  return L.join('\n').trim();
}
const msg=t=>{$('#msg').textContent=t};
const base=()=>'device-followup'+(V.fu?'-'+V.fu:'');
async function save(name,data){
  let d=null;try{d=await claude.use('downloads')}catch(e){}
  if(!d&&typeof claude==='undefined'){
    try{const b=data instanceof Blob?data:new Blob([data]);const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();msg('บันทึกแล้ว')}catch(e){msg('บันทึกไม่สำเร็จ')}
    return}
  if(!d){msg('ดาวน์โหลดไม่ได้ในมุมมองนี้ — กด Copy แทน');return}
  try{await d.save({filename:name,data});msg('บันทึกแล้ว')}catch(e){msg(e&&e.code==='declined'?'ยกเลิก':'บันทึกไม่สำเร็จ ('+(e&&e.code||'error')+')')}
}
const loadJs=src=>new Promise((ok,no)=>{const e=document.createElement('script');e.src=src;e.onload=ok;e.onerror=no;document.head.appendChild(e)});
let libP=null;
const libs=()=>libP||(libP=Promise.all([window.html2canvas||loadJs('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'),window.jspdf||loadJs('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js')]).catch(e=>{libP=null;throw e}));
async function shot(scale){
  const box=document.createElement('div');box.className='rep';
  box.style.cssText='position:fixed;left:-9999px;top:0;width:324px;padding:12px;background:#fff;border:0';
  box.innerHTML=body();document.body.appendChild(box);
  try{return await html2canvas(box,{scale,backgroundColor:'#fff'})}finally{box.remove()}
}
$('#pdf').onclick=async()=>{
  msg('กำลังโหลดตัวสร้าง PDF...');
  try{await libs()}catch(e){msg('โหลดตัวสร้าง PDF ไม่ได้ (ต้องต่อเน็ต) — ใช้ .html หรือ Copy แทน');return}
  msg('กำลังสร้าง PDF...');
  try{
    const cv=await shot(2);
    const pdf=new jspdf.jsPDF({unit:'mm',format:'a4'});
    const W=cv.width/2*0.2646,H=277,ph=Math.floor(H*cv.width/W),X=(210-W)/2;
    for(let y=0,i=0;y<cv.height;y+=ph,i++){
      const h=Math.min(ph,cv.height-y),sl=document.createElement('canvas');
      sl.width=cv.width;sl.height=h;sl.getContext('2d').drawImage(cv,0,y,cv.width,h,0,0,cv.width,h);
      if(i)pdf.addPage();
      pdf.addImage(sl.toDataURL('image/jpeg',.95),'JPEG',X,12,W,h*W/cv.width);
    }
    await save(base()+'.pdf',pdf.output('arraybuffer'));
  }catch(e){msg('สร้าง PDF ไม่สำเร็จ')}
};
$('#img').onclick=async()=>{
  msg('กำลังโหลดตัวสร้างรูป...');
  try{await libs()}catch(e){msg('โหลดตัวสร้างรูปไม่ได้ (ต้องต่อเน็ต) — ใช้ .html หรือ Copy แทน');return}
  msg('กำลังสร้างรูป...');
  try{
    const cv=await shot(3);
    const b=await new Promise(r=>cv.toBlob(r,'image/png'));
    await save(base()+'.png',b);
  }catch(e){msg('สร้างรูปไม่สำเร็จ')}
};
